name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  biome:
    name: Biome (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run check
      - name: STATUS.md freshness
        run: npm run status:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run type:check:all

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test:backend

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test:frontend

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E suite
        run: npm run test:e2e
        env:
          DB_TYPE: sqlite
          # GEOCODING_ENABLED=false — CI firewall doesn't allow Nominatim (ADL-10).
          # SQLITE_PATH/BYPASS_AUTH/OWNER_CLERK_ID are set inline by playwright.config.ts's
          # webServer command, so they're not needed here.
          GEOCODING_ENABLED: false
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  test-contract:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Initialise database schema
        run: npm run db:migrate
        env:
          DB_TYPE: sqlite
          SQLITE_PATH: file:./dev.db
      - name: Start backend server
        run: npm run start &
        env:
          DB_TYPE: sqlite
          SQLITE_PATH: file:./dev.db
          PORT: 3001
          GEOCODING_ENABLED: false
          BYPASS_AUTH: true
          # ADL-27: Set test_clerk_id as owner so bypass test user gets is_owner=1 at startup.
          # Contract tests that call owner-only routes (POST /api/cities, admin, shading) require this.
          OWNER_CLERK_ID: test_clerk_id
      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/health && break
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          curl -sf http://localhost:3001/health || (echo "Backend did not start in time" && exit 1)
      - run: npm run test:contract
