name: Security Checks

# ADL-40: `production` is deliberately excluded from the push trigger.
#
# The dependency-scan job runs `npm audit`, which queries the GitHub Advisory
# Database at run time — so its verdict is a function of commit *and date*, not
# commit alone. That broke promotion: 299ab5c passed on main 2026-07-24 and the
# identical tree failed on production 2026-07-26, because GHSA-v422-hmwv-36x6
# (body-parser) was published in between. Railway gates prod deploys on CI green
# and is all-or-nothing about which checks count, so a newly-published advisory
# blocked prod deploys entirely — including the deploy that would have fixed it.
#
# Check runs attach to a commit SHA, not a branch, and `production` is only ever
# fast-forwarded from main (never a PR target). So a promoted SHA already carries
# this workflow's green statuses, earned on main. Skipping the re-run doesn't
# remove the security verdict — it freezes it at the point it was earned, which
# is what makes promotion deterministic. ci.yml still runs on every branch and
# still gates production.
on:
  push:
    branches-ignore: ["production"]
  pull_request:
    branches: [main, master]

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # SEC-13b: Fail on HIGH or CRITICAL vulnerabilities. MODERATE: log only.
      - name: npm audit (HIGH+)
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # Full history required for Gitleaks

      # SEC-13a: Scan for accidentally committed secrets.
      # OP-17: the gitleaks-action wrapper (both v2 and v3.0.0) gates on a
      # GITHUB_TOKEN "user eligibility" API call that has been unreliable, with
      # no GITLEAKS_LICENSE fallback configured — it hard-fails when that call
      # 503s. The underlying gitleaks scanner itself is open-source and
      # license-free; running the pinned binary directly removes the
      # dependency on that call entirely. Version + sha256 pinned like every
      # other tool in this repo (drizzle-kit, Playwright) — bump both together.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Gitleaks secret scan
        run: ./gitleaks detect --source=. --redact --no-banner

  sast:
    name: Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # SEC-13c: SAST covering TypeScript, React, Node.js, OWASP Top 10
      - name: Semgrep SAST
        run: |
          semgrep \
            --config p/typescript \
            --config p/react \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --config .semgrep/security.yml \
            --error \
            --quiet
        # To suppress a false positive, add a comment above the line:
        # nosemgrep: <rule-id> -- reason: <justification>
